<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroTrade - Logs</title>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .container { max-width:1100px; margin:0 auto; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:20px; }
  header h1 { font-size:20px; }
  header a { color:var(--accent); font-size:14px; text-decoration:none; }
  .tabs { display:flex; gap:0; margin-bottom:16px; }
  .tab { padding:8px 20px; font-size:14px; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--muted); }
  .tab:first-child { border-radius:6px 0 0 6px; }
  .tab:last-child { border-radius:0 6px 6px 0; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); }
  td { padding:6px 8px; border-bottom:1px solid rgba(48,54,61,.5); font-family:monospace; }
  .empty { text-align:center; padding:40px; color:var(--muted); }
  .event-item { padding:4px 0; border-bottom:1px solid rgba(48,54,61,.3); font-size:12px; font-family:monospace; }
  .event-item .time { color:var(--muted); margin-right:8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Logs & Decisions</h1>
    <a href="/">&larr; Dashboard</a>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('events')">Event Log</div>
    <div class="tab" onclick="switchTab('api')">API Calls</div>
    <div class="tab" onclick="switchTab('decisions')">AI Decisions</div>
  </div>

  <div style="max-height:calc(100vh - 180px);overflow-y:auto" id="log-content"></div>
</div>

<script>
const API = '';
let currentTab = 'events';
let eventSource = null;
let events = [];

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['events','api','decisions'][i] === tab));
  loadTab();
}

async function loadTab() {
  const el = document.getElementById('log-content');
  if (currentTab === 'events') {
    el.innerHTML = events.map(e => `<div class="event-item"><span class="time">${e.time}</span><span style="color:${e.color}">${e.msg}</span></div>`).join('') || '<div class="empty">이벤트 없음</div>';
  } else if (currentTab === 'api') {
    const r = await fetch(API+'/api/logs/all?count=100');
    const d = await r.json();
    const logs = d.logs || [];
    if (!logs.length) { el.innerHTML = '<div class="empty">API 호출 이력 없음</div>'; return; }
    el.innerHTML = '<table><thead><tr><th>시간</th><th>유형</th><th>호출</th><th>소요</th><th>상태</th></tr></thead><tbody>' +
      logs.map(l => {
        const t = l.timestamp ? l.timestamp.slice(11,19) : '';
        const isMcp = l.type === 'mcp';
        const label = isMcp ? '<span style="color:var(--accent)">MCP</span>' : '<span style="color:var(--yellow)">KIS</span>';
        const call = isMcp ? `${l.tool}(${Object.values(l.input||{}).map(v=>JSON.stringify(v)).join(',')})` : `${l.method} ${l.path} ${l.tr_id||''}`;
        const ok = isMcp ? l.success : l.status===200;
        return `<tr><td>${t}</td><td>${label}</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${call}</td><td>${l.duration_ms}ms</td><td style="color:${ok?'var(--green)':'var(--red)'}">${isMcp?(l.success?'OK':'ERR'):(l.status||'-')}</td></tr>`;
      }).join('') + '</tbody></table>';
  } else {
    const r = await fetch(API+'/api/decisions?count=50');
    const d = await r.json();
    const decisions = d.decisions || [];
    if (!decisions.length) { el.innerHTML = '<div class="empty">판단 이력 없음</div>'; return; }
    el.innerHTML = '<table><thead><tr><th>시간</th><th>유형</th><th>파이프</th><th>행동</th><th>입력</th><th>출력</th></tr></thead><tbody>' +
      decisions.map(e => {
        const t = e.timestamp ? e.timestamp.slice(11,19) : '';
        return `<tr><td>${t}</td><td>${e.type}</td><td>${e.pipe_id||'-'}</td><td>${e.action_taken}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.input_summary||'-'}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.output_summary||'-'}</td></tr>`;
      }).join('') + '</tbody></table>';
  }
}

// SSE for events
function connectSSE() {
  eventSource = new EventSource(API+'/api/events');
  ['tick','trigger','order','system','error','etf_scan','etf_trade'].forEach(type => {
    eventSource.addEventListener(type, e => {
      const d = JSON.parse(e.data);
      const colors = {trigger:'var(--yellow)',order:'var(--green)',error:'var(--red)',system:'var(--accent)'};
      events.unshift({time: new Date().toLocaleTimeString(), msg: `[${type}] ${JSON.stringify(d.data||d).slice(0,120)}`, color: colors[type]||'var(--text)'});
      if (events.length > 200) events.pop();
      if (currentTab === 'events') loadTab();
    });
  });
}

connectSSE();
loadTab();
setInterval(() => { if (currentTab !== 'events') loadTab(); }, 15000);
</script>
</body>
</html>
