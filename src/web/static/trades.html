<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroTrade - Trade History</title>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .container { max-width:1100px; margin:0 auto; padding:20px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:20px; }
  header h1 { font-size:20px; }
  header a { color:var(--accent); font-size:14px; text-decoration:none; }

  .tabs { display:flex; gap:0; margin-bottom:16px; }
  .tab { padding:8px 20px; font-size:14px; cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--muted); }
  .tab:first-child { border-radius:6px 0 0 6px; }
  .tab:last-child { border-radius:0 6px 6px 0; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .controls { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .controls label { font-size:13px; color:var(--muted); }
  input[type=date], select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:13px; }

  .summary-bar { display:flex; gap:20px; margin-bottom:16px; font-size:13px; }
  .summary-item { display:flex; align-items:center; gap:4px; }
  .summary-item .val { font-weight:600; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); }
  td { padding:8px; border-bottom:1px solid rgba(48,54,61,.5); }
  .up { color:var(--red); }
  .down { color:var(--accent); }

  .empty { text-align:center; padding:40px; color:var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Trade History</h1>
    <a href="/">&larr; Dashboard</a>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('real')">실제 체결 (KIS)</div>
    <div class="tab" onclick="switchTab('bot')">봇 내부 로그</div>
  </div>

  <div class="controls">
    <label>시작 <input type="date" id="start-date" onchange="loadData()"></label>
    <label>종료 <input type="date" id="end-date" onchange="loadData()"></label>
    <label>매매 <select id="filter-side" onchange="filterTable()">
      <option value="">전체</option><option value="buy">매수</option><option value="sell">매도</option>
    </select></label>
    <label>파이프 <select id="filter-pipe" onchange="filterTable()">
      <option value="">전체</option>
    </select></label>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div style="max-height:calc(100vh - 300px);overflow-y:auto">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">거래 내역 없음</div>
  </div>
</div>

<script>
const API = '';
let currentTab = 'real';
let allRows = [];

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab === 'real' ? '실제' : '봇')));
  loadData();
}

function today() { return new Date().toISOString().slice(0,10); }

async function loadData() {
  const start = document.getElementById('start-date').value.replace(/-/g, '') || '';
  const end = document.getElementById('end-date').value.replace(/-/g, '') || '';

  if (currentTab === 'real') {
    const r = await fetch(`${API}/api/account/executions?start=${start}&end=${end}`);
    const d = await r.json();
    allRows = (d.executions || []).map(e => ({
      time: e.order_time ? `${e.order_time.slice(0,2)}:${e.order_time.slice(2,4)}:${e.order_time.slice(4)}` : '',
      date: e.order_date || '',
      code: e.stock_code, name: e.stock_name, side: e.side,
      qty: e.exec_qty, price: e.exec_price, amount: e.exec_amount,
      status: e.status, order_no: e.order_no, pipe: '',
    }));
    document.getElementById('table-head').innerHTML = '<tr><th>시간</th><th>종목</th><th>매매</th><th>수량</th><th>체결가</th><th>체결금액</th><th>상태</th><th>주문번호</th></tr>';
  } else {
    const r = await fetch(`${API}/api/trades`);
    const d = await r.json();
    allRows = (d.trades || []).map(t => ({
      time: t.timestamp ? t.timestamp.slice(11,19) : '',
      date: t.timestamp ? t.timestamp.slice(0,10) : '',
      code: t.stock_code, name: '', side: t.side,
      qty: t.quantity, price: t.price, amount: t.quantity * t.price,
      status: t.success ? '성공' : '실패', order_no: t.order_no || '', pipe: t.strategy_id || '',
    }));
    document.getElementById('table-head').innerHTML = '<tr><th>시간</th><th>종목</th><th>매매</th><th>수량</th><th>가격</th><th>금액</th><th>결과</th><th>파이프</th></tr>';

    // 파이프 필터 옵션
    const pipes = [...new Set(allRows.map(r => r.pipe).filter(Boolean))];
    const sel = document.getElementById('filter-pipe');
    sel.innerHTML = '<option value="">전체</option>' + pipes.map(p => `<option value="${p}">${p}</option>`).join('');
  }
  filterTable();
}

function filterTable() {
  const side = document.getElementById('filter-side').value;
  const pipe = document.getElementById('filter-pipe').value;

  let rows = allRows;
  if (side) rows = rows.filter(r => r.side === side);
  if (pipe) rows = rows.filter(r => r.pipe === pipe);

  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-msg');

  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = ''; updateSummary([]); return; }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const cls = r.side === 'buy' ? 'up' : 'down';
    const sideLabel = r.side === 'buy' ? 'BUY' : 'SELL';
    const last = currentTab === 'real' ? r.order_no : r.pipe;
    return `<tr>
      <td style="font-family:monospace">${r.time}</td>
      <td>${r.name || ''} <code style="font-size:11px">${r.code}</code></td>
      <td class="${cls}" style="font-weight:600">${sideLabel}</td>
      <td>${r.qty}</td>
      <td>${r.price ? r.price.toLocaleString() : '-'}</td>
      <td>${r.amount ? r.amount.toLocaleString() : '-'}</td>
      <td>${r.status}</td>
      <td style="font-size:11px;color:var(--muted)">${last}</td>
    </tr>`;
  }).join('');
  updateSummary(rows);
}

function updateSummary(rows) {
  const buys = rows.filter(r => r.side === 'buy');
  const sells = rows.filter(r => r.side === 'sell');
  const buyAmt = buys.reduce((s,r) => s + (r.amount||0), 0);
  const sellAmt = sells.reduce((s,r) => s + (r.amount||0), 0);
  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-item">총 <span class="val">${rows.length}건</span></div>
    <div class="summary-item" style="color:var(--red)">매수 <span class="val">${buys.length}건 (${buyAmt.toLocaleString()}원)</span></div>
    <div class="summary-item" style="color:var(--accent)">매도 <span class="val">${sells.length}건 (${sellAmt.toLocaleString()}원)</span></div>
  `;
}

// 초기화
document.getElementById('start-date').value = today();
document.getElementById('end-date').value = today();
loadData();
</script>
</body>
</html>
